<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Message</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <h1 class="title">A Message for You</h1>

        <div class="message-container">
            <div class="message-content" id="message">
<p>MESSAGE EXPIRED</p>
            </div>
        </div>

        <div class="controls">
            <button id="playBtn" class="btn play-btn">
                <i class="fas fa-play"></i> Play
            </button>
            <button id="pauseBtn" class="btn pause-btn">
                <i class="fas fa-pause"></i> Pause
            </button>
            <button id="replayBtn" class="btn replay-btn" style="display: none;">
                <i class="fas fa-redo"></i> Replay
            </button>

            <div class="speed-control">
                <span class="speed-label">Speed:</span>
                <select id="speedSelect" class="speed-select">
                    <option value="slow" selected>1.0</option>
                    <option value="normal">1.5</option>
                    <option value="fast">2.0</option>
                    <option value="veryfast">3.0</option>
                </select>
            </div>
            
            <div class="button-group">
                <button id="downloadBtn" class="btn download-btn">
                    <i class="fas fa-download"></i> Save Message
                </button>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status" id="status">Paused</div>
        </div>

        <div class="instructions">
            <p><i class="fas fa-info-circle"></i> Click Play to start scrolling through the message.</p>
            <p><i class="fas fa-info-circle"></i> Don't change the speed while the text plays.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
